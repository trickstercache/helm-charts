name: Release Chart(s)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write # needed for ghcr access
      id-token: write # needed for keyless signing
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One job per chart so each pushed OCI artifact gets its own attestation.
        chart:
          - trickster
    env:
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        run: helm package charts/${{ matrix.chart }} --destination dist
      - name: Push chart to GHCR
        id: push
        run: |
          set -o pipefail
          helm push dist/${{ matrix.chart }}-*.tgz "oci://${GHCR_REPO}" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1)
          if [[ -z "$digest" ]]; then
            echo "::error::could not read the pushed chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # Signs a SLSA build provenance statement for the chart with the workflow's
      # OIDC identity (Sigstore), records it in the repo's attestation store, and
      # pushes it to GHCR next to the chart. Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/charts/<chart>:<version> --owner <owner>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_REPO }}/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
