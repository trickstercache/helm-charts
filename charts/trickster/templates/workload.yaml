{{- include "trickster.validatePersistence" . -}}
{{- $kind := include "trickster.workloadKind" . -}}
{{- $perPodClaims := eq (include "trickster.useVolumeClaimTemplates" .) "true" -}}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "trickster.fullname" . }}
  {{- if .Values.deploymentAnnotations }}
  annotations:
  {{- toYaml .Values.deploymentAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "trickster.labels" . | nindent 4 }}
    {{- if .Values.deploymentLabels }}
    {{- toYaml .Values.deploymentLabels | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if eq $kind "StatefulSet" }}
  serviceName: {{ include "trickster.headlessServiceName" . }}
  podManagementPolicy: {{ .Values.statefulSet.podManagementPolicy }}
  {{- with .Values.statefulSet.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.statefulSet.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if .Values.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- else if and .Values.persistentVolume.enabled (not (has "ReadWriteMany" .Values.persistentVolume.accessModes)) }}
  # A ReadWriteOnce claim cannot be attached to the outgoing and incoming pod at
  # the same time, which leaves a RollingUpdate stuck forever. Recreate releases
  # the volume first. Override with deploymentStrategy if your storage allows it.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "trickster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/trickster-cfg: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "trickster.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trickster.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          {{- if .Values.extraEnv }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value }}
            {{- end }}
          {{- end }}
          {{- range $value := .Values.envSecrets }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secretName }}
                  key: {{ $value.secretKey }}
          {{- end }}
          args:
            - --config=/etc/trickster/config.yaml
          {{- if .Values.extraArgs }}
          {{- range $key, $value := .Values.extraArgs }}
            - --{{ $key }}={{ $value }}
          {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "trickster.proxyPort" . }}
              protocol: TCP
            - name: metrics
              containerPort: {{ include "trickster.metricsPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /trickster/ping
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /trickster/ping
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cfg-volume
              mountPath: /etc/trickster
            - name: storage
              mountPath: {{ .Values.persistentVolume.mountPath | default "/data" }}
              subPath: {{ .Values.persistentVolume.subPath | default ""}}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.additionalContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: cfg-volume
        configMap:
          name: {{ template "trickster.fullname" . }}
          items:
            - key: config.yaml
              path: config.yaml
      {{- if not $perPodClaims }}
      - name: storage
      {{- if .Values.persistentVolume.enabled }}
        persistentVolumeClaim:
          claimName: {{ if .Values.persistentVolume.existingClaim }}{{ .Values.persistentVolume.existingClaim }}{{- else }}{{ template "trickster.fullname" . }}{{- end }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $perPodClaims }}
  # Each pod gets its own claim, so replicas never contend for one volume.
  volumeClaimTemplates:
    - metadata:
        name: storage
        {{- if .Values.persistentVolume.annotations }}
        annotations:
          {{- toYaml .Values.persistentVolume.annotations | nindent 10 }}
        {{- end }}
        labels:
          {{- include "trickster.labels" . | nindent 10 }}
          {{- if .Values.persistentVolume.labels }}
          {{- toYaml .Values.persistentVolume.labels | nindent 10 }}
          {{- end }}
      spec:
        {{- include "trickster.pvcSpec" . | nindent 8 }}
  {{- end }}
